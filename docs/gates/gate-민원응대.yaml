  options:
    - {label: "국민신문고가 뭔지부터 잡고 싶다", goto: A}
    - {label: "민원상담과 민원신청이 어떻게 다른지 모르겠다", leaf: B-상담에서신청}
    - {label: "민원 응대 태도·소통을 어떻게 잡나", leaf: C-소통과대응}
    - {label: "민원이 행안부 어느 조직과 연결되는지 궁금", leaf: D-행안부연결}
    - {label: "유사 민원·사례를 찾고 싶다", leaf: E-사례검색}
    - {label: "전혀 모름 — 전체 흐름부터", leaf: Z-전체흐름}

nodes:
