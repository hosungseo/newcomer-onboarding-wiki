    - {label: "월급·수당 항목이 헷갈린다", goto: C}
    - {label: "근무성적평가·성과관리가 궁금하다", leaf: D-평가}
    - {label: "기안·검토·결재·등록 (문서처리)", leaf: E-문서처리입구}
    - {label: "결재 끝난 문서 등록·등록번호", leaf: F-문서등록}
    - {label: "전혀 모름 — 인사적응 큰 틀부터", leaf: Z-핵심축}

nodes:
