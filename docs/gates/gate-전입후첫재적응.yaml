id: gate-전입후첫재적응
version: 2026-05-03
trigger: "새 부처·새 자리로 옮겼는데 무엇부터 다시 적응해야 할지 모르겠다"

entry_question:
  text: "지금 전입 후 가장 먼저 다시 잡아야 할 것은?"
  options:
    - {label: "기관 역할·조직 맥락", goto: A}
    - {label: "업무시스템 역할 구분", goto: B}
    - {label: "문서처리 타이밍", leaf: C-문서처리}
