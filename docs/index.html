<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신규공무원 적응 위키 · 관문</title>
<meta name="description" content="신규·전입 공무원이 상황을 고르면 읽어야 할 공개 자료를 안내하는 아키네이터식 관문">
<meta property="og:title" content="신규공무원 적응 위키">
<meta property="og:description" content="상황을 고르면 알맞은 공개 자료로 안내합니다">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --brand: #721FE5;
  --brand-2: #9B5FFF;
  --brand-tint: #F0E8FF;
  --bg: #FAFAFA;
  --card: #ffffff;
  --text: #1a1a1a;
  --text-2: #6A6A6A;
  --text-3: #9B9B9B;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.16);
  --muted: #F3F3F5;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-hover: 0 6px 20px rgba(0,0,0,0.08);
  --ease: cubic-bezier(0.4,0,0.2,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #B38AFF;
    --brand-2: #C9A8FF;
    --brand-tint: rgba(155,95,255,0.14);
    --bg: #0f0f10;
    --card: #1a1a1c;
    --text: #EDEDED;
    --text-2: #A0A0A0;
    --text-3: #6A6A6A;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --muted: #242426;
    --shadow: none;
    --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.55; -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss06', 'ss07';
}
button { font: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px; border-radius: var(--radius-sm);
}

.wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 80px; }

/* Header */
header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.head-inner {
  max-width: 720px; margin: 0 auto; padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
}
.logo { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.logo .dot { color: var(--brand); }
.head-home {
  font: inherit; font-size: 13px;
  background: none; border: none; color: var(--text-2); cursor: pointer;
  padding: 6px 10px; border-radius: var(--radius-sm);
}
.head-home:hover { background: var(--muted); color: var(--text); }
.spacer { flex: 1; }
.head-gate {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-2);
  background: var(--muted); padding: 6px 12px; border-radius: 999px;
  max-width: 240px;
}
.head-gate .current {
  color: var(--text); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;
}

/* Hero */
.hero { padding: 32px 0 20px; }
.hero h1 {
  font-size: 28px; font-weight: 700; margin: 0 0 10px;
  letter-spacing: -0.025em; line-height: 1.25;
}
.hero p { color: var(--text-2); margin: 0; font-size: 15px; }

/* Landing: gate cards */
.section-title {
  font-size: 13px; font-weight: 600; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin: 28px 0 12px;
}
.gate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.gate-card {
  text-align: left; width: 100%; padding: 16px 18px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  cursor: pointer; transition: all 180ms var(--ease);
  color: var(--text);
  display: flex; flex-direction: column; gap: 6px;
}
.gate-card:hover { border-color: var(--brand); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.gate-card .title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.gate-card .trigger { font-size: 13px; color: var(--text-2); line-height: 1.45; }
.gate-card .meta { font-size: 11px; color: var(--text-3); margin-top: 4px; }

/* Crumb (clickable) */
.crumb {
  display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px;
  min-height: 18px;
}
.crumb .chip {
  font: inherit; font-size: 12px;
  background: var(--muted); color: var(--text-2);
  padding: 4px 10px; border-radius: 999px;
  border: none; cursor: pointer;
  transition: all 150ms var(--ease);
}
.crumb .chip:hover { background: var(--brand-tint); color: var(--brand); }
.crumb .sep { color: var(--text-3); align-self: center; font-size: 11px; }

/* Question */
.q {
  font-size: 20px; font-weight: 600;
  letter-spacing: -0.015em; line-height: 1.4;
  margin: 0 0 16px;
}

/* Options */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 15px 18px;
  font-size: 15px; font-weight: 500; color: var(--text);
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  cursor: pointer; transition: all 180ms var(--ease);
}
.opt .label { flex: 1; min-width: 0; line-height: 1.4; }
.opt .arrow {
  width: 16px; height: 16px; flex: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M6 3l5 5-5 5' stroke='%239B9B9B' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
  transition: transform 180ms var(--ease);
}
.opt:hover { border-color: var(--brand); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.opt:hover .arrow { transform: translateX(3px); }
.opt.dim {
  background: var(--muted); color: var(--text-2);
  box-shadow: none; font-weight: 400;
}
.opt.dim:hover { border-color: var(--border-strong); transform: none; box-shadow: none; }

/* Leaf */
.leaf-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  background: var(--brand-tint); color: var(--brand);
  font-size: 12px; font-weight: 600; margin-bottom: 10px;
}
.leaf-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 18px; line-height: 1.3; }

.notes-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 16px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.notes-card .section-title { margin: 10px 4px 6px; }
.note {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 6px;
  border-bottom: 1px solid var(--border);
  color: var(--text); text-decoration: none;
  transition: color 150ms var(--ease);
}
.note:last-child { border-bottom: none; }
.note:hover { color: var(--brand); }
.note .ico {
  width: 30px; height: 30px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--muted); border-radius: 8px; font-size: 14px;
}
.note .name { flex: 1; min-width: 0; font-size: 13.5px; word-break: break-all; line-height: 1.4; }
.note .ext { color: var(--text-3); font-size: 12px; flex: none; }
.note-alt {
  display: inline-block; margin: 6px 6px 10px; font-size: 11px; color: var(--text-3);
}
.note-alt a { color: var(--text-3); }

/* Feedback */
.feedback {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 14px; background: var(--muted);
  border-radius: var(--radius); font-size: 13px; color: var(--text-2);
  margin-bottom: 18px;
}
.feedback .label { flex: 1; min-width: 140px; }
.fb-btn {
  font-size: 13px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  cursor: pointer; transition: all 150ms var(--ease);
}
.fb-btn:hover { border-color: var(--brand); color: var(--brand); }
.fb-btn:disabled { opacity: 0.5; cursor: default; }

/* Nav bar */
.nav-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.nav-btn {
  font-size: 13px; font-weight: 500;
  padding: 10px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--card); color: var(--text-2);
  cursor: pointer; transition: all 180ms var(--ease);
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 100%;
}
.nav-btn .target {
  color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
}
.nav-btn:hover { border-color: var(--brand); color: var(--brand); }
.nav-btn:hover .target { color: var(--brand); }
.nav-btn.primary { background: var(--brand); color: white; border-color: var(--brand); }
.nav-btn.primary .target { color: white; }
.nav-btn.primary:hover { filter: brightness(1.08); color: white; }
.nav-btn.primary:hover .target { color: white; }

/* Footer */
footer { margin-top: 56px; font-size: 12px; color: var(--text-3); text-align: center; line-height: 1.8; }
footer a { color: var(--text-3); }

.err { color: #d4183d; padding: 14px; background: rgba(212,24,61,0.08); border-radius: var(--radius); font-size: 14px; }
.skel { height: 56px; background: var(--muted); border-radius: var(--radius); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:0.35} }
@keyframes fadeUp { from {opacity:0; transform:translateY(4px)} to {opacity:1; transform:none} }
#app > * { animation: fadeUp 220ms var(--ease) both; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <button class="head-home" id="home-btn" title="관문 목록으로">← 전체</button>
    <div class="spacer"></div>
    <div class="head-gate" id="head-gate" style="display:none">
      <span>현재:</span><span class="current" id="head-current"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="app"></div>
  <footer>
    <p>공개자료 기반 · 피드백은 브라우저에 저장됩니다<br>
    <a href="#" onclick="exportGateLog();return false">로그 내보내기</a> ·
    <a href="https://github.com/hosungseo/newcomer-onboarding-wiki" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</div>

<script type="module">
import { parse } from 'https://cdn.jsdelivr.net/npm/yaml@2.5.0/browser/index.js';

// Same-origin on GitHub Pages; dev fallback to raw.
const GATES_BASE = './gates/';
const INDEX_URL = './gates.json';
const REPO_BLOB = 'https://github.com/hosungseo/newcomer-onboarding-wiki/blob/main';

const app = document.getElementById('app');
const homeBtn = document.getElementById('home-btn');
const headGate = document.getElementById('head-gate');
const headCurrent = document.getElementById('head-current');

let gateIndex = [];        // [{file, id, trigger, isSubgate, ...}]
let gateIndexById = {};
let currentGate = null;
let currentGateFile = null;
let pathStack = [];        // previous states, for back
let gateStack = [];        // parent {file, gate, pathStack} when entering a subgate
let currentState = null;   // last rendered state

// ---------- logging ----------
const LOG_KEY = 'gate-feedback-log';
function log(event) {
  try {
    const entry = { ts: Date.now(), gate: currentGateFile, ...event };
    const arr = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
    arr.push(entry);
    localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(-500)));
  } catch {}
}
window.exportGateLog = () => {
  const blob = new Blob([localStorage.getItem(LOG_KEY) || '[]'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `gate-log-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};

// ---------- bootstrap ----------
async function boot() {
  homeBtn.onclick = () => goHome();
  window.addEventListener('hashchange', applyHash);
  try {
    const r = await fetch(INDEX_URL);
    const j = await r.json();
    gateIndex = j.gates;
    gateIndexById = Object.fromEntries(gateIndex.map(g => [g.id, g]));
  } catch (e) {
    app.innerHTML = `<div class="err">관문 목록을 불러오지 못했습니다.</div>`;
    return;
  }
  applyHash();
}
boot();

function applyHash() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!hash) return renderLanding();
  // hash = "gate-이름[/leaf:X|node:Y]"
  const [gateId, ...rest] = hash.split('/');
  if (!gateIndexById[gateId]) return renderLanding();
  loadGate(gateId + '.yaml', rest.join('/'));
}

function setHash(gateId, sub) {
  const v = sub ? `${gateId}/${sub}` : gateId;
  const next = '#' + encodeURIComponent(v).replace(/%2F/g, '/');
  if (location.hash !== next) history.replaceState(null, '', next);
}

// ---------- landing ----------
function renderLanding() {
  currentGate = currentGateFile = null;
  pathStack = []; gateStack = [];
  headGate.style.display = 'none';
  homeBtn.style.visibility = 'hidden';
  app.innerHTML = '';

  const hero = document.createElement('section');
  hero.className = 'hero';
  hero.innerHTML = `
    <h1>상황을 고르면, 읽을 자료를 안내합니다</h1>
    <p>신규·전입 공무원이 마주치는 상황별로 공개 자료를 엮어놓았습니다. 한 번의 선택으로 시작하세요.</p>
  `;
  app.appendChild(hero);

  const main = gateIndex.filter(g => !g.isSubgate);
  const sec = document.createElement('div');
  sec.innerHTML = `<div class="section-title">관문 (${main.length})</div>`;
  app.appendChild(sec);

  const grid = document.createElement('div');
  grid.className = 'gate-grid';
  for (const g of main) {
    const card = document.createElement('button');
    card.className = 'gate-card';
    const shortId = g.id.replace(/^gate-/, '');
    card.innerHTML = `
      <div class="title">${shortId}</div>
      <div class="trigger">${g.trigger}</div>
      <div class="meta">리프 ${g.leafCount}개 · 진입 옵션 ${g.entryOptions}</div>
    `;
    card.onclick = () => { location.hash = encodeURIComponent(g.id); };
    grid.appendChild(card);
  }
  app.appendChild(grid);
}

// ---------- load ----------
async function loadGate(file, sub = '') {
  app.innerHTML = `<div class="skel"></div><div class="skel" style="margin-top:8px;opacity:.7"></div><div class="skel" style="margin-top:8px;opacity:.5"></div>`;
  homeBtn.style.visibility = 'visible';
  try {
    const r = await fetch(GATES_BASE + file);
    currentGate = parse(await r.text());
  } catch {
    app.innerHTML = `<div class="err">관문 파일을 불러오지 못했습니다: ${file}</div>`;
    return;
  }
  currentGateFile = file;
  pathStack = [];
  log({ type: 'gate_open' });
  updateHeadGate();
  if (sub) {
    // e.g. "leaf:A-인증관리센터" or "node:A.2"
    const m = /^(leaf|node):(.+)$/.exec(sub);
    if (m) {
      const [, k, id] = m;
      if (k === 'leaf' && currentGate.leaves?.[id]) return render({ kind: 'leaf', id });
      if (k === 'node' && currentGate.nodes?.[id]) return render({ kind: 'node', id });
    }
  }
  render({ kind: 'entry' });
}

function updateHeadGate() {
  if (!currentGate) { headGate.style.display = 'none'; return; }
  headGate.style.display = 'inline-flex';
  headCurrent.textContent = currentGate.id.replace(/^gate-/, '');
}

function goHome() {
  location.hash = '';
  renderLanding();
}

// ---------- resolve ----------
function resolve(target) {
  if (target == null) return null;
  if (target === 'root') return { kind: 'entry' };
  if (currentGate.nodes?.[target]) return { kind: 'node', id: target };
  if (currentGate.leaves?.[target]) return { kind: 'leaf', id: target };
  if (/^(concept|process|source|faq|section|hub|newcomer-path)-/.test(target))
    return { kind: 'note', id: target };
  if (/^gate-/.test(target)) return { kind: 'subgate', id: target };
  return null;
}

function targetLabel(target) {
  if (target == null) return null;
  if (target === 'root') return '처음';
  if (currentGate.leaves?.[target]) return target;
  if (currentGate.nodes?.[target]) {
    const q = currentGate.nodes[target].question || target;
    return q.length > 22 ? q.slice(0, 20) + '…' : q;
  }
  if (/^gate-/.test(target)) return (gateIndexById[target]?.id || target).replace(/^gate-/, '');
  if (/^(concept|process|source|faq|section|hub|newcomer-path)-/.test(target)) {
    return target.replace(/^(concept|process|source|faq|section|hub|newcomer-path)-/, '');
  }
  return target;
}

// ---------- navigation ----------
function navigateTo(target, label) {
  const next = resolve(target);
  if (!next) { app.innerHTML = `<div class="err">경로 미해결: ${target}</div>`; return; }
  if (next.kind === 'subgate') {
    // push parent gate state
    gateStack.push({ file: currentGateFile, gate: currentGate, pathStack: pathStack.slice(), state: currentState });
    loadGate(`${next.id}.yaml`);
    return;
  }
  pathStack.push({ state: currentState, label });
  render(next);
}

function goBack() {
  if (pathStack.length) {
    const prev = pathStack.pop();
    render(prev.state, { skipPush: true });
    return;
  }
  if (gateStack.length) {
    const p = gateStack.pop();
    currentGateFile = p.file; currentGate = p.gate; pathStack = p.pathStack;
    updateHeadGate();
    render(p.state || { kind: 'entry' }, { skipPush: true });
    return;
  }
  goHome();
}

function jumpCrumb(i) {
  // i = index in pathStack (0-based). Truncate stack and render that state.
  const target = pathStack[i];
  pathStack = pathStack.slice(0, i);
  render(target.state, { skipPush: true });
}

// ---------- render ----------
function render(state) {
  currentState = state;
  updateHashForState(state);
  app.innerHTML = '';
  renderCrumb();
  if (state.kind === 'entry') renderQuestion(currentGate.entry_question, null);
  else if (state.kind === 'node') renderQuestion(currentGate.nodes[state.id], state.id);
  else if (state.kind === 'leaf') renderLeaf(state.id);
  else if (state.kind === 'note') renderNote(state.id);
}

function updateHashForState(state) {
  if (!currentGate) return;
  const gid = currentGate.id;
  if (state.kind === 'entry') setHash(gid);
  else if (state.kind === 'leaf') setHash(gid, `leaf:${state.id}`);
  else if (state.kind === 'node') setHash(gid, `node:${state.id}`);
}

function renderCrumb() {
  const bar = document.createElement('div');
  bar.className = 'crumb';

  // Home chip
  const home = document.createElement('button');
  home.className = 'chip'; home.textContent = '처음';
  home.onclick = () => goHome();
  bar.appendChild(home);

  if (currentGate) {
    const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '›'; bar.appendChild(sep);
    const g = document.createElement('button');
    g.className = 'chip'; g.textContent = currentGate.id.replace(/^gate-/, '');
    g.onclick = () => render({ kind: 'entry' });
    bar.appendChild(g);
  }
  pathStack.forEach((p, i) => {
    const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '›'; bar.appendChild(sep);
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = p.label || '—';
    c.onclick = () => jumpCrumb(i + 1);
    bar.appendChild(c);
  });
  app.appendChild(bar);
}

function noteIcon(id) {
  if (id.startsWith('concept-')) return '💡';
  if (id.startsWith('process-')) return '⚙️';
  if (id.startsWith('source-')) return '📄';
  if (id.startsWith('faq-')) return '❓';
  if (id.startsWith('section-')) return '📑';
  if (id.startsWith('hub-')) return '🧭';
  if (id.startsWith('newcomer-path-')) return '🚪';
  return '📄';
}

function renderQuestion(q, nodeId) {
  if (!q) { app.innerHTML += `<div class="err">질문 누락</div>`; return; }
  const h = document.createElement('h2');
  h.className = 'q';
  h.textContent = q.text;
  app.appendChild(h);

  // Split "모름" options to bottom, styled dim
  const normal = [], unknown = [];
  for (const o of q.options) {
    const label = (o.label || '').trim();
    if (label === '모름' || /^모름[\s·—]/.test(label) || /모르/.test(label)) unknown.push(o);
    else normal.push(o);
  }

  const list = document.createElement('div');
  list.className = 'opts';
  const mk = (o, dim) => {
    const b = document.createElement('button');
    b.className = 'opt' + (dim ? ' dim' : '');
    b.innerHTML = `<span class="label"></span><span class="arrow"></span>`;
    b.querySelector('.label').textContent = o.label;
    b.onclick = () => {
      log({ type: 'choose', node: nodeId || 'entry', label: o.label, target: o.goto ?? o.leaf });
      navigateTo(o.goto ?? o.leaf, o.label);
    };
    list.appendChild(b);
  };
  normal.forEach(o => mk(o, false));
  unknown.forEach(o => mk(o, true));
  app.appendChild(list);
  renderNavBar();
}

function renderLeaf(id) {
  const leaf = currentGate.leaves[id];
  if (!leaf) { app.innerHTML += `<div class="err">리프 누락: ${id}</div>`; return; }
  log({ type: 'reach_leaf', leaf: id });

  const badge = document.createElement('div');
  badge.className = 'leaf-badge'; badge.textContent = `✓  ${id}`;
  app.appendChild(badge);

  const title = document.createElement('h2');
  title.className = 'leaf-title';
  title.textContent = '여기서부터 읽으세요';
  app.appendChild(title);

  const card = document.createElement('div');
  card.className = 'notes-card';
  card.innerHTML = `<div class="section-title">관련 자료 (${leaf.notes.length})</div>`;
  for (const n of leaf.notes) {
    const a = document.createElement('a');
    a.className = 'note';
    a.href = `${REPO_BLOB}/${n}.md`;
    a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `<span class="ico"></span><span class="name"></span><span class="ext">↗</span>`;
    a.querySelector('.ico').textContent = noteIcon(n);
    a.querySelector('.name').textContent = n;
    card.appendChild(a);
  }
  app.appendChild(card);

  // Feedback
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.innerHTML = `<span class="label">이 안내가 도움이 됐나요?</span>`;
  for (const [emoji, tag, label] of [['👍','hit','맞음'],['🤷','mid','애매'],['👎','miss','다름']]) {
    const b = document.createElement('button');
    b.className = 'fb-btn'; b.textContent = `${emoji} ${label}`;
    b.onclick = () => {
      log({ type: 'feedback', leaf: id, tag });
      b.textContent = '✓ 기록됨';
      fb.querySelectorAll('.fb-btn').forEach(x => x.disabled = true);
    };
    fb.appendChild(b);
  }
  app.appendChild(fb);

  // Exit nav with target labels
  const exits = document.createElement('div');
  exits.className = 'nav-bar';
  const mk = (prefix, target, primary) => {
    if (target == null) return;
    const b = document.createElement('button');
    b.className = 'nav-btn' + (primary ? ' primary' : '');
    const label = targetLabel(target);
    b.innerHTML = `<span>${prefix}</span><span class="target"></span>`;
    b.querySelector('.target').textContent = label;
    b.onclick = () => navigateTo(target, label);
    exits.appendChild(b);
  };
  mk('↑ 얕게', leaf.exits.shallow, false);
  mk('↓ 깊게', leaf.exits.deeper, true);
  mk('↔ 옆으로', leaf.exits.sideways, false);
  app.appendChild(exits);
  renderNavBar();
}

function renderNote(id) {
  const card = document.createElement('div');
  card.className = 'notes-card';
  card.innerHTML = `<div class="section-title">직접 참조</div>`;
  const a = document.createElement('a');
  a.className = 'note'; a.href = `${REPO_BLOB}/${id}.md`;
  a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = `<span class="ico"></span><span class="name"></span><span class="ext">↗</span>`;
  a.querySelector('.ico').textContent = noteIcon(id);
  a.querySelector('.name').textContent = id;
  card.appendChild(a);
  app.appendChild(card);
  renderNavBar();
}

function renderNavBar() {
  const hasParentGate = gateStack.length > 0;
  const canBack = pathStack.length > 0 || hasParentGate;
  if (!canBack) return;
  const nav = document.createElement('div');
  nav.className = 'nav-bar';
  const back = document.createElement('button');
  back.className = 'nav-btn';
  if (hasParentGate && pathStack.length === 0) {
    const parent = gateStack[gateStack.length - 1];
    back.innerHTML = `<span>← 부모 관문</span><span class="target"></span>`;
    back.querySelector('.target').textContent = parent.gate.id.replace(/^gate-/, '');
  } else {
    back.textContent = '← 뒤로';
  }
  back.onclick = goBack;
  nav.appendChild(back);
  app.appendChild(nav);
}
</script>
</body>
</html>
