name: Validate Gates
on:
  pull_request:
    paths: ['gates/**', 'scripts/**', '*.md']
  push:
    branches: [main]
    paths: ['gates/**', 'scripts/**', '*.md']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd scripts && npm install --no-audit --no-fund
      - run: cd scripts && node validate-gates.mjs
      - name: Rebuild gates index
        run: cd scripts && node build-gates-index.mjs
      - name: Rebuild graph data
        run: cd scripts && node build-graph-data.mjs
      - name: Check generated docs assets are up to date
        run: |
          if ! git diff --quiet docs/gates.json docs/gates/ docs/graph-data.json; then
            echo "::error::Generated docs assets are out of date. Run 'npm --prefix scripts run build-index' and 'npm --prefix scripts run build-graph' locally and commit."
            git diff --stat docs/
            exit 1
          fi
