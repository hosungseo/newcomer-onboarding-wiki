  options:
    - {label: "국가인재원 교육운영 큰 틀부터 잡고 싶다", leaf: A-운영계획}
    - {label: "공직가치·국정과제 모듈", leaf: B-공직가치}
    - {label: "예산·재정 실무 모듈", leaf: C-예산재정}
    - {label: "인사제도 모듈", leaf: D-인사제도}
    - {label: "입법절차 모듈", leaf: E-입법}
    - {label: "보고서 작성 모듈", leaf: F-보고서}
    - {label: "AI 활용·업무시스템 모듈", goto: G}
    - {label: "소통협업·민원대응 모듈", leaf: H-소통민원}
    - {label: "인사·복무·문서처리 실무 질문이 먼저", leaf: X-실무입구}
    - {label: "전혀 모름 — common-core 허브부터", leaf: Z-허브}

nodes:
  # ─────── G. AI · 업무시스템 ───────
  G:
    question: "어느 시스템·모듈에 가까운가?"
    options:
      - {label: "AI 활용 (행안부 AI·데이터 축)", leaf: G-AI}
      - {label: "업무시스템 일반 (e사람·dBrain)", leaf: G-시스템}
      - {label: "e사람 (인사기록 시스템)", leaf: G-e사람}
      - {label: "모름 — 시스템 큰 틀부터", leaf: G-시스템}

