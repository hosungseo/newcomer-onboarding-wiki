id: gate-전입후첫재적응
version: 2026-05-03
trigger: "새 부처·새 자리로 옮겼는데 무엇부터 다시 적응해야 할지 모르겠다"

entry_question:
  text: "지금 전입 후 가장 먼저 다시 잡아야 할 것은?"
  options:
    - {label: "기관 역할·조직 맥락", goto: A}
    - {label: "업무시스템 역할 구분", goto: B}
    - {label: "문서처리 타이밍", goto: C}
    - {label: "인사·복무 타이밍", goto: D}
    - {label: "예산·재정 타이밍", goto: E}
    - {label: "전혀 모름 — 전입 첫날 최소 동선부터", leaf: Z-전체흐름}

nodes:
  A:
    question: "지금 어느 기관 맥락을 먼저 다시 잡아야 하나?"
    options:
      - {label: "행정안전부 축", leaf: A-행정안전부}
      - {label: "인사혁신처 축", leaf: A-인사혁신처}
      - {label: "기획재정부 축", leaf: A-기획재정부}
      - {label: "모름 — 기관 공통 입구부터", leaf: A-기관공통}
  B:
    question: "지금 어느 시스템 역할부터 다시 구분해야 하나?"
    options:
      - {label: "e사람 — 인사·급여·복무", leaf: B-e사람}
      - {label: "dBrain — 예산·재정·집행", leaf: B-dBrain}
      - {label: "국민신문고 — 민원상담·신청·조회", leaf: B-국민신문고}
      - {label: "모름 — 시스템 공통 입구부터", leaf: B-시스템공통}
  C:
    question: "지금 다시 잡아야 하는 문서처리 쪽은 어느 흐름에 더 가까운가?"
    options:
      - {label: "내부 문서 흐름 — 기안·검토·결재·등록", leaf: C-내부문서}
      - {label: "대외 응대 흐름 — 민원·정보공개", leaf: C-대외응대}
      - {label: "모름 — 문서처리 공통 입구부터", leaf: C-문서공통}
  D:
    question: "지금 다시 맞춰야 하는 인사·복무 쪽은 어디에 더 가까운가?"
    options:
      - {label: "휴가 — 연가·병가·특별휴가", leaf: D-휴가}
      - {label: "유연근무 — 시차출퇴근·재택·집약근무", leaf: D-유연근무}
      - {label: "수당·보수 — 급여 항목과 구조", leaf: D-수당보수}
      - {label: "근무성적평가·성과관리", leaf: D-평가}
      - {label: "모름 — 인사·복무 공통 입구부터", leaf: D-인사복무공통}
  E:
    question: "지금 다시 잡아야 하는 예산·재정 쪽은 어디에 더 가까운가?"
    options:
      - {label: "예산 전체 그림 — 나라살림과 큰 구조", leaf: E-전체그림}
      - {label: "편성 기준 — 예산안편성지침·기준", leaf: E-편성기준}
      - {label: "dBrain 실무 — 예산·재정·집행 시스템", leaf: E-dBrain실무}
      - {label: "모름 — 예산 공통 입구부터", leaf: E-예산공통}

